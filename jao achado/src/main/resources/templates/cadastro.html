
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Achados e Perdidos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="app-shell">

    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">📍</span>
            <span class="brand-copy">
                <strong>Achados<span>&</span>Perdidos</strong>
                <small>comunidade do campus</small>
            </span>
        </a>
    </header>

    <main class="publish-page">
        <section class="publish-intro">
            <p class="eyebrow">FAÇA PARTE DA COMUNIDADE</p>
            <h1>Criar sua conta</h1>
            <p class="welcome-copy">
                Cadastre-se para publicar e encontrar objetos perdidos.
            </p>
        </section>

        <section class="publish-form">

            <!-- Mensagens de retorno -->
            <div th:if="${erro}" class="page-message error-message"
                 th:text="${erro}"></div>

            <div th:if="${sucesso}" class="page-message success-message"
                 th:text="${sucesso}"></div>

            <form class="post-form" th:action="@{/cadastro}" method="post">

                <label class="field-label" for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required maxlength="100">

                <label class="field-label" for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="seuemail@exemplo.com" required maxlength="120">

                <label class="field-label" for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       placeholder="Crie uma senha" required minlength="8">

                <label class="field-label" for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha"
                       placeholder="Digite a senha novamente" required minlength="8">

                <button type="submit" class="submit-button">
                    Criar minha conta
                    <span>→</span>
                </button>

                <p style="text-align:center; font-size:11px; margin-top:10px;">
                    Já possui uma conta?
                    <a th:href="@{/login}" class="back-link">Entrar</a>
                </p>

            </form>
        </section>

        <a class="back-link" th:href="@{/}">← Voltar para o mural</a>
    </main>

</div>

</body>
</html>
